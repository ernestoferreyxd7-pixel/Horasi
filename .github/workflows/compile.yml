
name: Compile Dedsafio Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          echo "PROJECT_DIR=$(find extracted -name build.gradle -printf '%h\n' | head -1)" >> $GITHUB_ENV

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
                   "$GITHUB_WORKSPACE/gradle-8.10.2/bin/gradle" build

      - uses: actions/upload-artifact@v4
        with:
          name: dedsafio-fabric-1.21.1
          path: extracted/**/build/libs/*.jar
          
